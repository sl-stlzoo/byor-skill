name: validate
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pytest
      - run: bash scripts/audit.sh
      - run: python scripts/check_config.py
      - run: python scripts/build_interview.py --check
      - run: pytest -q tests
      - run: python scripts/build_bundle.py
      - run: git diff --exit-code BUNDLE.md BUNDLE-FULL.md || (echo "A bundle is stale; run scripts/build_bundle.py" && exit 1)
